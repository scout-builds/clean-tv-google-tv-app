name: Build APK

# Compiles the real, installable APK from this project and publishes it:
# every push builds a debug APK artifact; version tags (v1.0.0) also cut a
# GitHub Release with the APK attached — that release is the install link.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clean TV — Google TV App-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Attach APK to release (version tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          body: |
            Clean TV — Google TV App — installable APK built by GitHub Actions.
            Sideload it to your Google TV (Downloader / Send Files to TV),
            or install with adb. Package app.cleantv.tv installs side-by-side
            with Kodi, which stays untouched.
