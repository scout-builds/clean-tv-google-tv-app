<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Clean TV — Google TV App</title>
<link rel="stylesheet" href="css/tv.css">
</head>
<body>
<div id="bg"></div>
<header id="topbar">
  <div id="logo">Clean TV — Google TV App</div>
  <nav id="mainnav">
    <button class="navbtn focusable" data-view="home">Home</button>
    <button class="navbtn focusable" data-view="library">My Library</button>
    <button class="navbtn focusable" data-view="search">Search</button>
    <button class="navbtn focusable" data-view="addons">Addons</button>
    <button class="navbtn focusable" data-view="settings">Settings</button>
  </nav>
  <div id="clock"></div>
</header>
<main id="stage"></main>
<div id="player" class="hidden">
  <video id="video" controls></video>
  <div id="playerbar">
    <span id="playertitle"></span>
    <span id="playerctrls">
      <button id="speedbtn" class="focusable">Speed 1×</button>
      <button id="closeplayer" class="focusable">Back — close player</button>
    </span>
  </div>
</div>
<div id="toast" class="hidden"></div>
<script src="js/catalog.js"></script>
<script src="js/app.js"></script>
</body>
</html>
